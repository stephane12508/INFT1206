<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
Name: Joel ngniayie
File: image-gallery.html
Date: 21 July 2026
A JavaScript-powered image gallery with a thumbnail bar, clickable thumbnails that update the main image, and a darken/lighten toggle button.
-->
<title>Image Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Image gallery example</h1>

  <div class="full-img">
    <img
      class="displayed-img"
      src="https://mdn.github.io/shared-assets/images/examples/learn/gallery/pic1.jpg"
      alt="Closeup of a human eye" />
    <div class="overlay"></div>
    <button class="dark">Darken</button>
  </div>

  <div class="thumb-bar"></div>

  <script src="main.js"></script>
</body>
</html>
